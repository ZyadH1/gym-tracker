<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>IronLog</title>
<meta name="description" content="A simple, fast gym workout tracker." />

<!-- PWA / iOS home screen -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#7c5cff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0b0b10" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="IronLog" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />

<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <!-- ===== HOME ===== -->
  <section id="home-view" class="view">
    <div class="view-header">
      <div>
        <h1>IronLog</h1>
        <div class="subtitle" id="home-date"></div>
      </div>
    </div>
    <div id="home-content"></div>
  </section>

  <!-- ===== WORKOUT SESSION ===== -->
  <section id="workout-view" class="view">
    <div class="session-header">
      <button class="btn-icon btn-secondary" id="session-close" aria-label="End session">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div class="progress-track" id="session-progress"></div>
    </div>
    <div class="exercise-stage" id="exercise-stage"></div>
  </section>

  <!-- ===== SESSION SUMMARY ===== -->
  <section id="summary-view" class="view">
    <div class="summary-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
    </div>
    <h1 class="text-center" id="summary-title">Workout complete</h1>
    <p class="subtitle text-center" id="summary-subtitle"></p>
    <div class="summary-list" id="summary-list"></div>
    <button class="btn btn-primary btn-block btn-lg mt-5" id="summary-done">Done</button>
  </section>

  <!-- ===== STATS ===== -->
  <section id="stats-view" class="view">
    <div class="view-header">
      <div><h1>Stats</h1><div class="subtitle">Your progress over time</div></div>
    </div>
    <div id="stats-content"></div>
  </section>

  <!-- ===== SCHEDULE ===== -->
  <section id="schedule-view" class="view">
    <div class="view-header">
      <div><h1>Schedule</h1><div class="subtitle">Your training split</div></div>
      <button class="btn-icon btn-secondary" id="schedule-add-day" aria-label="Add day">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <div id="schedule-content"></div>
  </section>

  <!-- ===== SETTINGS ===== -->
  <section id="settings-view" class="view">
    <div class="view-header">
      <div><h1>Settings</h1></div>
    </div>
    <div id="settings-content"></div>
    <input type="file" id="import-file-input" class="file-input-hidden" accept="application/json" />
  </section>

  <!-- ===== BOTTOM NAV ===== -->
  <nav id="bottom-nav">
    <div class="nav-inner">
      <button class="nav-btn" data-nav="home-view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1v-9"/></svg>
        <span>Home</span>
      </button>
      <button class="nav-btn" data-nav="stats-view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
        <span>Stats</span>
      </button>
      <button class="nav-btn" data-nav="schedule-view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span>Schedule</span>
      </button>
      <button class="nav-btn" data-nav="settings-view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9c.23.51.23 1.1 0 1.61"/></svg>
        <span>Settings</span>
      </button>
    </div>
  </nav>

  <div id="toast"></div>
  <div class="sheet-backdrop" id="sheet-backdrop">
    <div class="sheet" id="sheet-content"></div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
